name: 数据库清库

# ⚠ 危险：删除 public schema 下全部表与数据，不可撤销。
#
# 唯一触发方式：手动，且必须输入 RESET 才执行。
# 没有定时、没有自动、不随推送触发 —— 避免误操作。
#
# 清库后要恢复：
#   1. Actions → 数据库迁移 → 选 all
#   2. 网页重新设置站点保护密码

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '输入 RESET 确认清库（区分大小写）'
        required: true
        default: ''

jobs:
  reset:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: 确认
        run: |
          if [ "${{ inputs.confirm }}" != "RESET" ]; then
            echo "::error::确认词不是 RESET，已取消。不会动任何数据。"
            exit 1
          fi
          echo "确认通过，准备清库"

      - name: 清库前快照（留个证据）
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          DB_URL="$(printf '%s' "$DB_URL" | tr -d '\r\n')"
          export DB_URL
          OUT=report.txt
          : > "$OUT"
          echo "清库时间: $(date -u)" >> "$OUT"
          echo "--- 清库前 ---" >> "$OUT"
          psql "$DB_URL" -tAc "select coalesce(string_agg(table_name,', ' order by table_name),'（空）') from information_schema.tables where table_schema='public'" >> "$OUT" 2>&1
          psql "$DB_URL" -tAc "select '用户'||count(*) from users" >> "$OUT" 2>&1
          psql "$DB_URL" -tAc "select '消息'||count(*) from messages" >> "$OUT" 2>&1
          cat "$OUT"

      - name: 执行清库
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          DB_URL="$(printf '%s' "$DB_URL" | tr -d '\r\n')"
          export DB_URL
          # ⚠ 这里曾经 curl raw.githubusercontent.com/.../Tool/main/supabase/reset.sql。
          #    Tool 是**私有仓库**，匿名 raw 请求一律 404 —— 也就是说这个下载
          #    从来没成功过，清库一直在走下面那段 4 行的"回退脚本"。
          #    回退版缺 grant create 与 3 条 alter default privileges，
          #    重跑 schema.sql 后新建对象会没权限，且没有任何报错。
          #    W0 不可逆操作不该依赖一个必然失败的下载，改成整份内嵌。
          #
          #    权威源仍是 Tool/ops/reset.sql。改那份时同步改这里：
          #      python3 Tool/tools/verify/reset-sql-sync.py
          cat > /tmp/reset.sql <<'SQL'
          -- ==================================================================
          -- 清库脚本（危险！不可撤销）
          --
          -- 用途：当数据库状态失控、表结构错乱、或想彻底回到「刚建项目」的状态时使用。
          -- 效果：删除 public schema 下的【全部】表、函数、数据，然后重建空 schema。
          --
          -- ⚠ 会丢失：所有账号、消息、帖子、会话、站点设置。
          -- ⚠ 不会动：auth schema（Supabase 自带的认证表）、storage、项目本身。
          --
          -- 执行后要恢复服务，请再跑一次：
          --   Actions → 数据库迁移 → 选 all
          -- 然后回到网页重新设置站点保护密码（因为 site 表也清空了）。
          --
          -- 执行方式（推荐，带确认）：
          --   Actions → 数据库清库 → 输入 RESET → Run workflow
          -- 或手动：
          --   psql "$SUPABASE_DB_URL" -f reset.sql
          -- ==================================================================

          -- 删掉整个 public schema 及其内部所有对象
          drop schema if exists public cascade;

          -- 重建空 schema
          create schema public;

          -- 恢复 Supabase 需要的默认授权
          grant usage  on schema public to postgres, anon, authenticated, service_role;
          grant all    on schema public to postgres, service_role;
          grant create on schema public to postgres;

          -- 让未来新建的对象默认就有权限（否则重跑 schema.sql 后还要再授权）
          alter default privileges in schema public grant all on tables to postgres, service_role;
          alter default privileges in schema public grant all on sequences to postgres, service_role;
          alter default privileges in schema public grant all on functions to postgres, service_role;

          -- 清理后确认
          \echo '===== 清库后状态 ====='
          select coalesce(string_agg(table_name, ', ' order by table_name), '（空）') as 剩余表
          from information_schema.tables where table_schema='public';

          select count(*) as 剩余函数
          from pg_proc p join pg_namespace n on n.oid = p.pronamespace
          where n.nspname = 'public';
          SQL
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f /tmp/reset.sql 2>&1 | tee -a report.txt

      - name: 结果写回 diag 分支
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name  "diag-bot"
          git config user.email "diag@local"
          git checkout --orphan diag-db-reset 2>/dev/null || git checkout diag-db-reset
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f report.txt
          git commit -m "清库 $(date -u +%Y%m%d-%H%M%S)" || echo "无变化"
          git push -f origin diag-db-reset
