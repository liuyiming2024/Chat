name: 原生端构建

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: 构建 debug 包
        id: build
        working-directory: native/android
        # ⚠ 沙箱读不到 Actions 日志（网络策略挡 results-receiver 域名），
        #   所以把输出落盘、再推回分支，否则只能看到"失败了"却不知道为什么。
        run: |
          set -uo pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          echo "RC=${PIPESTATUS[0]}"
      - name: 日志推回 diag 分支
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          git config user.name  "diag-bot"
          git config user.email "diag@local"
          git fetch origin diag-native 2>/dev/null || true
          git checkout -B diag-native
          mkdir -p .diag
          cp native/android/build.log .diag/native-build.log 2>/dev/null || echo "无 build.log" > .diag/native-build.log
          git add -f .diag || true
          git commit -m "原生端构建日志 $(date -u +%Y%m%d-%H%M%S)" || echo "无变化"
          git push -f origin diag-native
      - name: 失败则让 job 失败
        if: always()
        run: |
          if [ -f native/android/build.log ] && grep -q "^RC=0" native/android/build.log; then exit 0; fi
          echo "::error::构建失败，详见 diag-native 分支的 .diag/native-build.log"
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: chat-native-debug
          path: native/android/app/build/outputs/apk/debug/*.apk
