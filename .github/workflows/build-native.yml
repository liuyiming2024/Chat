name: 原生端构建

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    # ⚠ 必须显式给 contents: write，否则"日志推回分支"那步 push 会被拒（403），
    #   分支根本创建不出来 —— 结果就是只看得到"构建失败"四个字。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: 补生成 gradle wrapper
        working-directory: native/android
        # ⚠ 仓库里只有 gradle-wrapper.properties，缺 gradlew 与 gradle-wrapper.jar。
        #   本地没法生成 jar（二进制），所以在 CI 里用 gradle 现生成，
        #   这样以后 ./gradlew 就能用了，也让本地复现路径一致。
        continue-on-error: true
        run: |
          gradle wrapper --gradle-version 8.9 || true
          chmod +x gradlew 2>/dev/null || true
          ls -la gradle/wrapper/ 2>/dev/null || true

      - name: 构建 debug 包
        id: build
        working-directory: native/android
        # ⚠ 沙箱读不到 Actions 日志（网络策略挡 results-receiver 域名），
        #   所以把输出落盘、再推回分支，否则只能看到"失败了"却不知道为什么。
        run: |
          set -uo pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log
          # ⚠ 直接以 gradle 的退出码结束这一步（BUILD-EXIT-CODE）。
          #   原来写成 echo "RC=${PIPESTATUS[0]}" 再在下一步 grep "^RC=" ——
          #   但那行 echo 在 tee **之后**，根本不会写进 build.log，
          #   于是下一步永远 grep 不到，构建成功也被判成失败。
          #   日志里明明写着 BUILD SUCCESSFUL，job 却是红的 —— 非常误导。
          exit ${PIPESTATUS[0]}
      - name: 单元测试
        id: unittest
        working-directory: native/android
        # ⚠ NATIVE-TEST：构建成功只说明"能编译"，说明不了"行为对不对"。
        #   长度校验、撤回时限这类规则错了没有任何提示，
        #   靠看界面永远发现不了 —— 必须自动化验证。
        # ⚠ 直接以 gradle 的退出码结束（同 BUILD-EXIT-CODE 的教训）：
        #   把 RC 写进日志再 grep 是会漏的，那行 echo 在 tee 之后不会落盘。
        # ⚠⚠ --rerun-tasks 是**必须的**，不能省（NATIVE-TEST-CACHE）。
        #   实测发现：不加它时 gradle 会用远程 build cache 的结果，
        #   日志里显示 `testDebugUnitTest FROM-CACHE`，**测试根本没跑**，
        #   而 job 是绿的 —— 这是最危险的假绿：以为验证过了，其实什么都没发生。
        #
        #   单元测试只要 1~2 秒，缓存它毫无收益，
        #   却会换来"改了代码但测的还是旧结果"这种完全误导的结论。
        #   **测试结果不可缓存** —— 一条测试的价值就在于它真的被执行了。
        run: |
          set -uo pipefail
          gradle testDebugUnitTest --rerun-tasks --stacktrace 2>&1 | tee test.log
          exit ${PIPESTATUS[0]}

      - name: 测试结果摘要
        if: always()
        working-directory: native/android
        # 把每个用例的结果打印出来。只看 BUILD SUCCESSFUL 不够 ——
        # 得看到"跑了几条、都叫什么"，否则无法确认测的是不是我以为的那个。
        run: |
          echo "=== 单元测试结果 ==="
          find app/build/test-results -name '*.xml' 2>/dev/null | while read f; do
            python3 - "$f" <<'PY'
import sys, xml.etree.ElementTree as ET
r = ET.parse(sys.argv[1]).getroot()
print("%s: %s 条, 失败 %s" % (r.get('name'), r.get('tests'), r.get('failures')))
for tc in r.iter('testcase'):
    st = 'FAIL' if tc.find('failure') is not None else 'ok'
    print("   [%s] %s" % (st, tc.get('name')))
PY
          done

      - name: 日志推回 diag 分支
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          git config user.name  "diag-bot"
          git config user.email "diag@local"
          git fetch origin diag-native 2>/dev/null || true
          git checkout -B diag-native
          mkdir -p .diag
          cp native/android/build.log .diag/native-build.log 2>/dev/null || echo "无 build.log" > .diag/native-build.log
          cp native/android/test.log .diag/native-test.log 2>/dev/null || true
          git add -f .diag || true
          git commit -m "原生端构建日志 $(date -u +%Y%m%d-%H%M%S)" || echo "无变化"
          git push -f origin diag-native
      - uses: actions/upload-artifact@v4
        with:
          name: chat-native-debug
          path: native/android/app/build/outputs/apk/debug/*.apk
