name: 数据库诊断

# 只做连通性检查，不改任何数据。用来区分「连不上」和「SQL 有错」。
# 全程不打印密码；结果写到 diag 分支的 report.txt，便于回传排查。

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 1. 收集诊断信息（不打印密码）
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          # 去除首尾空白/换行：手动粘贴 Secret 时极易在末尾带上回车，
          # 会导致库名变成 "postgres\n" 而连不上。
          DB_URL="$(printf '%s' "$DB_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          export DB_URL
          OUT=report.txt
          : > "$OUT"
          {
            echo "时间: $(date -u)"
            echo "psql: $(psql --version 2>&1)"
            echo
            echo "=== URL 结构（密码已打码）==="
            echo "$DB_URL" | sed -E 's#(postgres://[^:]+:)[^@]+(@.*)#\1********\2#'
            echo
            echo "=== 解析结果 ==="
          } >> "$OUT"
          python3 - >> "$OUT" <<'PYCODE'
          import os
          from urllib.parse import urlparse
          u = os.environ.get('DB_URL','')
          try:
              p = urlparse(u)
              print('协议 :', p.scheme)
              print('主机 :', p.hostname)
              print('端口 :', p.port)
              print('用户 :', p.username)
              print('密码长度:', len(p.password or ''))
              print('库名 :', repr(p.path.lstrip('/')))
              if p.port == 5432:
                  print('⚠ 5432 是直连端口，Actions 建议用 6543')
              if 'pooler' not in (p.hostname or ''):
                  print('⚠ 主机名不含 pooler，可能不是连接池地址')
          except Exception as e:
              print('解析失败:', e)
          PYCODE
          {
            echo
            echo "=== 连接测试 ==="
          } >> "$OUT"
          if timeout 40 psql "$DB_URL" -tAc "select version()" > conn.out 2> conn.err; then
            echo "✅ 连接成功" >> "$OUT"
            cat conn.out >> "$OUT"
            echo >> "$OUT"
            echo "=== 现状 ===" >> "$OUT"
            echo "已有表:" >> "$OUT"
            psql "$DB_URL" -tAc "select coalesce(string_agg(table_name,', ' order by table_name),'（空）') from information_schema.tables where table_schema='public'" >> "$OUT" 2>&1
            echo "已有函数数:" >> "$OUT"
            psql "$DB_URL" -tAc "select count(*) from information_schema.routines where routine_schema='public'" >> "$OUT" 2>&1
            echo "pgcrypto:" >> "$OUT"
            psql "$DB_URL" -tAc "select extname from pg_extension where extname='pgcrypto'" >> "$OUT" 2>&1
          else
            echo "❌ 连接失败，原始错误如下：" >> "$OUT"
            cat conn.err >> "$OUT"
          fi

      - name: 2. 结果写回 diag 分支
        run: |
          set -euo pipefail
          git config user.name  "diag-bot"
          git config user.email "diag@local"
          git checkout --orphan diag 2>/dev/null || git checkout diag
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f report.txt
          git commit -m "诊断结果 $(date -u +%Y%m%d-%H%M%S)" || echo "无变化"
          git push -f origin diag
