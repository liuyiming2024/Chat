name: 执行 Code 云盘建表

# 为什么 Code 的迁移要放在 Chat 仓库里跑？
#
#   Code 与 Chat 连的是同一个 Supabase 项目，云盘只是多一张 code_files 表
#   和几个函数。但两边各存了一份 SUPABASE_DB_URL：
#
#     · Chat 的那份是有效的（一直在用）
#     · Code 的那份密码不对 —— 它当初照抄了私有库 凭据.md 里那条连接串，
#       而那条已经过时了
#
#   修这个有两个障碍，都不是代码能绕过的：
#
#     1. GitHub 的 Secret 只能写不能读。拿不到 Chat 在用的正确值，
#        所以没法"从 Chat 复制一份到 Code"。
#     2. Supabase 托管版里 postgres 不是 superuser：
#           create role ... superuser  → permission denied
#           alter role postgres ...    → permission denied (privileged role)
#        所以既建不出新角色，也改不了密码 —— 只能在控制台重置。
#
#   于是正解是：迁移统一走这边，用 Chat 的有效凭据。
#   Code 仓库那个 workflow 留着做校验，不再自己执行。

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: 执行 Code 云盘建表
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          DB_URL="$(printf '%s' "$DB_URL" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          export DB_URL
          OUT=migrate-log.txt
          : > "$OUT"

          # ⚠ 不存副本：cloud.sql 唯一源头是 Code 仓库。
          #   之前在 Chat 这边存了一份 .github/sql/code-cloud.sql，
          #   结果两边开始漂移 —— 对面 AI 在 Code 那份加了说明头，
          #   Chat 这份没有，diff 出来 8 行差异。
          #   副本迟早会漂移，这是必然，不是意外。
          #   正解：每次从源头现拉，仓库里不留第二份。
          FILE="/tmp/code-cloud.sql"
          SRC="https://raw.githubusercontent.com/liuyiming2024/Code/main/code/supabase/cloud.sql"
          echo "从源头拉取：$SRC"
          curl -fsSL "$SRC" -o "$FILE" || {
            echo "::error::拉取 cloud.sql 失败（Code 仓库或文件路径变了？）"
            exit 1
          }
          # 拉到的必须像个 SQL 脚本：空文件或 404 页面不能拿去执行
          if [ ! -s "$FILE" ]; then echo "::error::拉到的是空文件"; exit 1; fi
          if ! grep -q "code_files" "$FILE"; then
            echo "::error::拉到的内容里没有 code_files，可能不是 cloud.sql"
            head -5 "$FILE"; exit 1
          fi
          echo "拉到 $(wc -l < "$FILE") 行" 

          # 全部幂等（create table if not exists / create or replace），
          # 所以重复跑是安全的 —— 这也是"放到这边来跑"能成立的前提。
          timeout 180 psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$FILE" 2>&1 | tee -a "$OUT"
          RC=${PIPESTATUS[0]}
          echo "psql 退出码 $RC" | tee -a "$OUT"

          echo "=== 校验 ===" | tee -a "$OUT"
          psql "$DB_URL" -tAc "select 'code_files 表: ' || count(*) from information_schema.tables where table_schema='public' and table_name='code_files'" 2>&1 | tee -a "$OUT"
          psql "$DB_URL" -tAc "select 'code_ 函数数: ' || count(*) from information_schema.routines where routine_schema='public' and routine_name like 'code_%'" 2>&1 | tee -a "$OUT"
          # 确认没碰坏 Chat 自己的东西
          psql "$DB_URL" -tAc "select 'Chat 账号数: ' || count(*) from users" 2>&1 | tee -a "$OUT"

          [ "$RC" = "0" ] || { echo "::error::建表失败，退出码 $RC"; exit 1; }

      # 沙箱读不到 Actions 日志（网络策略挡），只能写回分支。
      - name: 日志推回 diag 分支
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          git config user.name  "diag-bot"
          git config user.email "diag@local"
          git fetch origin diag-db-code 2>/dev/null || true
          git checkout -B diag-db-code
          mkdir -p .diag
          cp migrate-log.txt .diag/db-code.log 2>/dev/null || true
          git add -f .diag || true
          git commit -m "Code 云盘建表日志 $(date -u +%Y%m%d-%H%M%S)" || echo "无变化"
          git push -f origin diag-db-code
