name: 构建安卓 APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        type: choice
        options: [debug, release]
        default: debug
  # 推送到 main 时自动出 debug 包，方便随时下载验证
  push:
    branches: [main]
    paths:
      - 'chat/**'
      - 'index.html'
      - 'assets/**'
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 不用 setup-android：GitHub 的 ubuntu 镜像自带 Android SDK，
      # 这个 action 在本仓库会直接失败（已知会打断构建）。
      - name: 指定 Android SDK 路径
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" || true
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          ls "$ANDROID_HOME" || echo "镜像未预装 SDK，将依赖 gradle 自动下载"

      # 之前每一步都写 `|| true`，结果 cap add 失败也吞掉，
      # 一路滑到 gradlew 才炸，报的错跟真正的原因八竿子打不着。
      # 现在：平台目录必须真的生成出来，否则当场失败并报错。
      - name: 装 Capacitor 并添加安卓平台
        run: |
          npm i @capacitor/core @capacitor/cli @capacitor/android --silent --no-fund --no-audit
          npx cap init "聊天室" io.github.liuyiming2024.chat --web-dir=.
          npx cap add android
          test -d android && echo "android 平台已生成" || { echo "::error::cap add android 未生成 android/ 目录"; exit 1; }
          npx cap sync android
          test -f android/gradlew || { echo "::error::gradlew 缺失，平台模板不完整"; exit 1; }

      - name: 报告环境（失败时用于定位）
        if: always()
        run: |
          echo "JAVA_HOME=$JAVA_HOME"; java -version 2>&1 | head -3
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" 2>/dev/null | head -20 || echo "SDK 目录不存在"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "无 platforms"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "无 build-tools"

      - name: 生成签名密钥（仅 release 需要）
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks || true
          echo "storeFile=keystore.jks" >> android/keystore.properties || true
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/keystore.properties || true
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/keystore.properties || true
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/keystore.properties || true

      - name: 准备 Android 构建环境
        run: |
          # gradle 靠 local.properties 找 SDK，缺了它第一步就报 "SDK location not found"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          # 未接受许可时 gradle 会在下载组件那一步卡住并失败
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license" || true
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true

      - name: 构建 APK
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace --info
          else
            ./gradlew assembleDebug --no-daemon --stacktrace --info
          fi
        continue-on-error: false

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: chat-apk-${{ github.event.inputs.build_type || 'debug' }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
