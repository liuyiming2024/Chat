name: 构建安卓 APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        type: choice
        options: [debug, release]
        default: debug
  # 推送到 main 时自动出 debug 包，方便随时下载验证
  push:
    branches: [main]
    paths:
      - 'chat/**'
      - 'index.html'
      - 'assets/**'
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 不用 setup-android：GitHub 的 ubuntu 镜像自带 Android SDK，
      # 这个 action 在本仓库会直接失败（已知会打断构建）。
      - name: 指定 Android SDK 路径
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" || true
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          ls "$ANDROID_HOME" || echo "镜像未预装 SDK，将依赖 gradle 自动下载"

      - name: 装 Capacitor 并添加安卓平台
        run: |
          npm init -y --silent
          npm i @capacitor/core @capacitor/cli --silent --no-fund --no-audit
          # 仓库根目录没有 package.json 会被 init 覆盖，先确认
          node -e "const p=require('./package.json'); p.name='chat-shell'; p.private=true; require('fs').writeFileSync('package.json', JSON.stringify(p,null,2));"
          npx cap init "聊天室" io.github.liuyiming2024.chat --web-dir=. || true
          npm i @capacitor/android --silent --no-fund --no-audit
          npx cap add android || true
          npx cap sync android || true

      - name: 生成签名密钥（仅 release 需要）
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks || true
          echo "storeFile=keystore.jks" >> android/keystore.properties || true
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/keystore.properties || true
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/keystore.properties || true
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/keystore.properties || true

      - name: 构建 APK
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon -q
          else
            ./gradlew assembleDebug --no-daemon -q
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: chat-apk-${{ github.event.inputs.build_type || 'debug' }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
