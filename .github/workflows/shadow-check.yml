name: 影子副本一致性

# www/ 是 APP（Capacitor）与桌面版（Electron）的共同打包目录：
#   capacitor.config.json 的 webDir 指向 www
#   package.json 的 build.files 里是 www/**
# 源码在仓库根目录的 chat/ docs/ tieba/ api/ assets/。
#
# 两边没有任何自动同步机制，改了源码会打进旧版本。
# 已经真实发生过两次：
#
#   1. 2026-10-11 修了 chat/js/app.js 的跨房间状态泄漏，
#      www/chat/js/app.js 还是旧的 → 安卓用户装到的 APP 里 bug 一个没修，
#      而我们当时以为修好了。
#   2. www/electron/main.js 曾经是 81 行的旧版死代码，
#      被 files: www/** 一起打进安装包。
#
# 所以这里要覆盖【所有】会被打包进去的目录，不只是 chat/。
# docs/ 尤其不能漏 —— APP 里的使用手册跟网页版说的不是一回事，
# 比代码不同步更误导人。
#
# 独立成快 workflow（几秒），不挂在安卓构建（十几分钟）上。
# 早失败比晚失败便宜得多。
#
# 校验逻辑放在 scripts/sync-www.js，本文件只负责调用 ——
# 同一套逻辑写两份，早晚有一天对不上。

# ------------------------------------------------------------------
# ⚠ 2026-10-21 改了触发条件，理由必须写下来，否则下个人会改回去：
#
# 原来 push 时同时监听【源码目录】和 www/**，结果是：
#   只改源码的提交（没同步 www）会立刻被本 workflow 判红，
#   哪怕几秒后自动同步就把它修好了。
#   → 红得没有意义：它不是"有人忘了同步"，只是"还没轮到同步"。
#   → 反复的假红会让人学会忽略红色，那才是真的危险。
#
# 现在分工：
#   源码目录变更 → sync-www-auto.yml   负责同步并提交 www/
#   www/ 变更     → 本文件             负责复核两边确实一致
#   手工改了 www/ 而没同步源码 → 本文件立刻红，这是真问题
#
# 顺序上是 同步 → 提交 → 触发本文件 → 绿。一环扣一环，不打架。
# ------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths:
      # 不监听源码目录了：那归 sync-www-auto.yml 管，
      # 在这里监听只会产生"同步还没跑"的假红
      - 'www/**'
      - 'scripts/sync-www.js'
      - 'capacitor.config.json'
      - 'package.json'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # --check 只比对不改文件；不一致就退出码 1
      - name: 比对源码目录与 www 副本
        run: node scripts/sync-www.js --check
