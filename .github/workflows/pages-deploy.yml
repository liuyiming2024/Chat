name: 部署到 Pages

# 显式部署：把仓库内容作为静态站点发布。
#
# 为什么需要它：仓库的 Pages 构建方式已切到 GitHub Actions（build_type=workflow），
# 但切换后自动部署没有再触发，站点停留在旧版本。这里自己上传并部署，
# 不再依赖内置流程。
#
# 触发：推送到 main，或手动 Run workflow。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 排队：同时多次推送时只跑最新一次，其余取消
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: 准备发布内容
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          # 排除版本管理与开发相关目录；其余按原样发布
          tar --exclude=.git --exclude=.github --exclude=_site \
              -cf - . | (cd _site && tar -xf -)
          # 静态站点不需要 Jekyll 处理
          touch _site/.nojekyll

          # Service Worker 版本号：必须随内容变化，否则用户永远拿到旧缓存。
          # 用「commit sha + 本次发布内容哈希」定，改任何文件都会得到新版本号。
          VER="${GITHUB_SHA::8}"
          HASH=$(find _site -type f -not -name 'sw.js' 2>/dev/null | sort | xargs cat 2>/dev/null | md5sum | cut -c1-8)
          echo "注入 SW 版本: v${VER}-${HASH}"
          if [ -f _site/chat/sw.js ]; then
            sed -i "s|self.__CHAT_VERSION__|\"v${VER}-${HASH}\"|" _site/chat/sw.js
            grep -n "VERSION = " _site/chat/sw.js | head -1
          else
            echo "::warning::未找到 _site/chat/sw.js，跳过版本注入"
          fi
          echo "发布文件数: $(find _site -type f | wc -l)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
