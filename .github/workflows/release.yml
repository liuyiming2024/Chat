name: 发布客户端

# 把 APK 与 Windows 安装包打成 GitHub Release。
#
# 为什么必须用 Release 而不是只留 Actions artifacts：
#   artifacts 下载必须登录 GitHub 账号，而且 30 天就过期。
#   用户不知道有这东西，就算翻到了也下不了 —— 等于没发布。
# Release 的资产是免登录直链，不过期。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 版本号（如 v1.0.0）
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '21' }
      - name: 装 Capacitor 并生成安卓工程
        run: |
          npm i @capacitor/core @capacitor/cli @capacitor/android \
             @capacitor/local-notifications --silent --no-fund --no-audit
          npx cap add android
          npx cap sync android
      - name: 统一 Kotlin 标准库版本
        run: |
          cat >> android/app/build.gradle <<'EOF'

          configurations.all {
            resolutionStrategy {
              force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
              force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
              force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
            }
          }
          EOF
      - name: 构建 APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - name: 装 Electron 打包工具
        run: npm i --save-dev electron electron-builder --silent --no-fund --no-audit
      - name: 构建
        shell: bash
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: exe
          path: |
            dist/*.exe

  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with: { path: out, merge-multiple: true }

      # 文件名一律用英文：中文名在上传资产这一步容易出编码问题，
      # 而失败信息又不明确，排查成本太高。
      - name: 整理文件名
        run: |
          mkdir -p pkg
          find out -name '*.apk'      -exec cp {} pkg/chat-android.apk   \;
          find out -name '*Setup*.exe' -exec cp {} pkg/chat-setup.exe    \;
          find out -name '*portable*.exe' -exec cp {} pkg/chat-portable.exe \;
          find out -name '*.exe' | grep -v Setup | grep -v portable | head -1 | xargs -r -I{} cp {} pkg/chat-portable.exe
          ls -la pkg

      # 用 API 直接发，不走第三方 action：
      # 出错时能看到 GitHub 返回的正文，而不是只有一个红叉。
      - name: 发 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -e
          API=https://api.github.com/repos/${{ github.repository }}
          AUTH="Authorization: Bearer $GH_TOKEN"
          {
            echo "== 创建 Release =="
            REL=$(curl -s -X POST "$API/releases" -H "$AUTH" \
              -H "Accept: application/vnd.github+json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"聊天室 $TAG\",\"body\":\"网页版 / Windows / Android 三端安装包。\\n\\n未签名：安装时点「仍要运行」或允许「未知来源」即可，不影响功能。\"}")
            echo "$REL" | head -c 400
            UP=$(echo "$REL" | python3 -c "import sys,json;print(json.load(sys.stdin).get('upload_url','').split('{')[0])")
            echo ""
            echo "upload_url: $UP"
            for f in pkg/*; do
              N=$(basename "$f")
              echo "-- 上传 $N --"
              curl -s -X POST "$UP?name=$N&label=$N" \
                -H "$AUTH" -H "Content-Type: application/octet-stream" \
                --data-binary @"$f" | head -c 300
              echo ""
            done
          } 2>&1 | tee release-log.txt

      - name: 日志写回
        if: always()
        run: |
          git config user.name  "diag-bot"
          git config user.email "diag@local"
          git checkout --orphan diag-release 2>/dev/null || git checkout diag-release
          git rm -rf --cached . >/dev/null 2>&1 || true
          [ -f release-log.txt ] || echo "(无输出)" > release-log.txt
          git add -f release-log.txt
          git commit -m "发布日志 $(date -u +%Y%m%d-%H%M%S)" || echo "无变化"
          git push -f origin diag-release || echo "推送失败" 
