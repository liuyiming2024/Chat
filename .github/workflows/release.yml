name: 发布客户端

# 把各平台安装包打成 GitHub Release。
#
# 为什么必须用 Release 而不是只留 Actions artifacts：
#   artifacts 下载必须登录 GitHub 账号，而且 30 天就过期。
#   用户不知道有这东西，就算翻到了也下不了 —— 等于没发布。
# Release 的资产是免登录直链，不过期。
#
# 覆盖：Windows / macOS / Linux / Android。
#   iOS 不在此列 —— App Store 必须付费开发者账号，与"零成本"冲突，
#   那边的正解是网页版「添加到主屏幕」，落地页已写明。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 版本号（如 v1.0.0）
        required: true
        default: v1.0.0
      with_mac:
        description: 是否构建 macOS（公开仓库免费，但耗 10 倍计分钟、耗时更长）
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '21' }
      - name: 装 Capacitor 并生成安卓工程
        run: |
          npm i @capacitor/core @capacitor/cli @capacitor/android \
             @capacitor/local-notifications --silent --no-fund --no-audit
          npx cap add android
          npx cap sync android
      - name: 统一 Kotlin 标准库版本
        run: |
          cat >> android/app/build.gradle <<'EOF'

          configurations.all {
            resolutionStrategy {
              force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
              force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
              force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
            }
          }
          EOF
      - name: 准备签名密钥（自签名）
        run: |
          cd android/app
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            echo "storeFile=keystore.jks" >> ../keystore.properties
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> ../keystore.properties
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> ../keystore.properties
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> ../keystore.properties
          else
            keytool -genkeypair -v \
              -keystore keystore.jks -storetype JKS \
              -alias chat -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass chat1234 -keypass chat1234 \
              -dname "CN=Chat, OU=Personal, O=Chat, L=X, ST=X, C=CN"
            printf 'storeFile=keystore.jks\nstorePassword=chat1234\nkeyAlias=chat\nkeyPassword=chat1234\n' > ../keystore.properties
          fi
          cd ../..
          if ! grep -q signingConfigs android/app/build.gradle; then
            cat .github/android/signing.gradle >> android/app/build.gradle
          fi
      - name: 构建 APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - name: 构建
        shell: bash
        run: |
          npm i --save-dev electron electron-builder --silent --no-fund --no-audit
          npx electron-builder --win --x64 --publish never 2>&1 | tee build-log.txt
          echo "exit=${PIPESTATUS[0]}"
          ls dist >> build-log.txt 2>&1 || echo "dist 为空" >> build-log.txt

      # 诊断步骤：失败也不影响结论，但必须留线索 ——
      # 这一轮 linux 构建失败就是因为没有任何日志，只能盲改。
      - name: 日志写回
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name  "diag-bot"
          git config user.email "diag@local"
          git checkout --orphan diag-rel-win 2>/dev/null || git checkout diag-rel-win
          git rm -rf --cached . >/dev/null 2>&1 || true
          [ -f build-log.txt ] || echo "(无输出)" > build-log.txt
          git add -f build-log.txt
          git commit -m "发布构建日志 win $(date -u +%Y%m%d-%H%M%S)" || echo "无变化"
          git push -f origin diag-rel-win || echo "推送失败（不影响产物）"
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: exe, path: dist/*.exe }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - name: 构建
        run: |
          npm i --save-dev electron electron-builder --silent --no-fund --no-audit
          npx electron-builder --linux --x64 --publish never 2>&1 | tee build-log.txt
          echo "exit=${PIPESTATUS[0]}"
          ls dist >> build-log.txt 2>&1 || echo "dist 为空" >> build-log.txt

      # 诊断步骤：失败也不影响结论，但必须留线索 ——
      # 这一轮 linux 构建失败就是因为没有任何日志，只能盲改。
      - name: 日志写回
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name  "diag-bot"
          git config user.email "diag@local"
          git checkout --orphan diag-rel-linux 2>/dev/null || git checkout diag-rel-linux
          git rm -rf --cached . >/dev/null 2>&1 || true
          [ -f build-log.txt ] || echo "(无输出)" > build-log.txt
          git add -f build-log.txt
          git commit -m "发布构建日志 linux $(date -u +%Y%m%d-%H%M%S)" || echo "无变化"
          git push -f origin diag-rel-linux || echo "推送失败（不影响产物）"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb

  macos:
    if: ${{ github.event.inputs.with_mac }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - name: 构建
        run: |
          npm i --save-dev electron electron-builder --silent --no-fund --no-audit
          npx electron-builder --mac --x64 --arm64 --publish never 2>&1 | tee build-log.txt
          echo "exit=${PIPESTATUS[0]}"
          ls dist >> build-log.txt 2>&1 || echo "dist 为空" >> build-log.txt

      # 诊断步骤：失败也不影响结论，但必须留线索 ——
      # 这一轮 linux 构建失败就是因为没有任何日志，只能盲改。
      - name: 日志写回
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name  "diag-bot"
          git config user.email "diag@local"
          git checkout --orphan diag-rel-mac 2>/dev/null || git checkout diag-rel-mac
          git rm -rf --cached . >/dev/null 2>&1 || true
          [ -f build-log.txt ] || echo "(无输出)" > build-log.txt
          git add -f build-log.txt
          git commit -m "发布构建日志 mac $(date -u +%Y%m%d-%H%M%S)" || echo "无变化"
          git push -f origin diag-rel-mac || echo "推送失败（不影响产物）"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mac
          path: |
            dist/*.dmg
            dist/*.zip

  publish:
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    # 关键：publish 永远要跑，哪怕某个平台构建失败。
    # 之前 mac 缺失会让 needs 卡住，导致"部分成功"变成"整体失败"。
    if: always()
    steps:
      - uses: actions/download-artifact@v5
        with: { path: out, merge-multiple: true }

      # 文件名固定为英文，且不带版本号 ——
      # 落地页才能用 releases/latest/download/xxx 这种永久直链。
      - name: 整理文件名
        run: |
          mkdir -p pkg
          # 文件名已在 package.json 的 artifactName 里写死，
          # 这里按名拷即可 —— 不再靠 find 通配去猜（便携版就曾因中文名漏掉）
          # 桌面端的名字在 artifactName 里写死了，按名拷。
          # 但安卓是 gradle 产出的 app-debug.apk，不走 electron-builder，
          # 名字不受 artifactName 控制 —— 只能按扩展名找（逐个目标都打印，缺哪个一眼可见）。
          # 安卓文件名随构建类型变：debug→app-debug.apk，release→app-release.apk
          # 统一收成 chat-android.apk
          APK=$(find out -name 'app-release.apk' -o -name 'app-debug.apk' -o -name '*.apk' | head -1)
          if [ -n "$APK" ]; then cp "$APK" pkg/chat-android.apk; echo "  ✓ chat-android.apk"; else echo "  - apk 缺失"; fi
          for f in chat-win-setup.exe chat-win-portable.exe \
                   chat-mac.dmg chat-mac.zip chat-linux.AppImage; do
            FOUND=$(find out -name "$f" | head -1)
            if [ -n "$FOUND" ]; then cp "$FOUND" "pkg/$f"; echo "  ✓ $f"; else echo "  - $f 缺失"; fi
          done
          echo "===== 待发布 ====="
          ls -la pkg

      # 资产完整性断言。
      # v1.2.1 漏了 apk，而落地页的四条直链是无条件写死的 ——
      # 缺一个平台就是死链。靠人眼发现不可靠，这里缺一个直接失败。
      - name: 校验平台覆盖
        run: |
          MISSING=""
          for f in chat-android.apk chat-win-setup.exe chat-mac.dmg chat-linux.AppImage; do
            if [ ! -f "pkg/$f" ]; then
              echo "  ✗ 缺失 $f"
              MISSING="$MISSING $f"
            else
              echo "  ✓ $f $(du -h pkg/$f | cut -f1)"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::以下平台资产缺失，终止发布：$MISSING（缺一个就是死链）"
            exit 1
          fi
          echo "  四平台齐全"

      # 幂等：tag 已存在就先删掉旧 Release 再重建。
      # 之前用固定 tag 重跑会撞「tag 已存在」—— 把一个成功的事搞成真失败。
      # 用户看到红叉第一反应是重跑，所以这个必须能吃住重跑。
      - name: 发 Release（可重复运行）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          API=https://api.github.com/repos/${{ github.repository }}
          AUTH="Authorization: Bearer $GH_TOKEN"
          {
            echo "== 检查是否已存在 =="
            OLD=$(curl -s "$API/releases/tags/$TAG" -H "$AUTH")
            OLDID=$(echo "$OLD" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
            if [ -n "$OLDID" ] && [ "$OLDID" != "None" ]; then
              echo "发现旧 Release id=$OLDID，删除以重建"
              curl -s -X DELETE "$API/releases/$OLDID" -H "$AUTH" > /dev/null
              # 同名资产会在 recreate 后重新上传，旧 tag 的 ref 保留即可
            else
              echo "无旧 Release，直接新建"
            fi

            echo "== 创建 Release =="
            REL=$(curl -s -X POST "$API/releases" -H "$AUTH" \
              -H "Accept: application/vnd.github+json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"聊天室 $TAG\",\"body\":\"各平台安装包。未签名：Windows 点「仍要运行」、macOS 右键「打开」、安卓允许「未知来源」。\\n\\niPhone / iPad 无独立 App（App Store 需付费开发者账号），请用 Safari「添加到主屏幕」。\"}")
            echo "$REL" | head -c 500
            UP=$(echo "$REL" | python3 -c "import sys,json;print(json.load(sys.stdin).get('upload_url','').split('{')[0])" 2>/dev/null)
            echo ""
            echo "upload_url: $UP"
            if [ -z "$UP" ] || [ "$UP" = "None" ]; then
              echo "!! upload_url 解析为空，跳过上传（避免产出 -.apk 这类坏资产）"
              exit 1
            fi
            for f in pkg/*; do
              [ -e "$f" ] || continue
              N=$(basename "$f")
              echo "-- 上传 $N ($(du -h "$f" | cut -f1)) --"
              curl -s -X POST "$UP?name=$N&label=$N" \
                -H "$AUTH" -H "Content-Type: application/octet-stream" \
                --data-binary @"$f" | head -c 200
              echo ""
            done
            echo "== 完成 =="
          } 2>&1 | tee release-log.txt

      # 把版本号写回在线清单。
      # 客户端启动时读它来判断有没有更新 —— 不同步的话，
      # 用户点了"检查更新"永远看到旧版本号，更新功能等于没有。
      # 这一步必须成功，所以它【不加】continue-on-error。
      - name: 同步更新清单版本
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os
          tag = os.environ['TAG']
          p = 'update.json'
          d = json.load(open(p, encoding='utf-8'))
          old = d.get('version')
          d['version'] = tag
          json.dump(d, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('update.json version: %s -> %s' % (old, tag))
          PY
          git config user.name  "release-bot"
          git config user.email "release@local"
          git add update.json
          if git diff --cached --quiet; then
            echo "清单版本无变化"
          else
            git commit -m "更新清单版本号 ${{ github.event.inputs.tag }}"
            git push origin HEAD:main || echo "推送失败"
          fi

      # 诊断步骤永远不影响结论 —— 它失败过三次，把成功的事拖成红叉
      - name: 日志写回
        continue-on-error: true
        if: always()
        run: |
          git config user.name  "diag-bot"
          git config user.email "diag@local"
          git checkout --orphan diag-release 2>/dev/null || git checkout diag-release
          git rm -rf --cached . >/dev/null 2>&1 || true
          [ -f release-log.txt ] || echo "(无输出)" > release-log.txt
          git add -f release-log.txt
          git commit -m "发布日志 $(date -u +%Y%m%d-%H%M%S)" || echo "无变化"
          git push -f origin diag-release || echo "推送失败（不影响产物）"
