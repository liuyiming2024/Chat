name: 构建桌面版

# 三平台矩阵：Windows / macOS / Linux。
#
# 之前 options 里写了 all/win/mac/linux，matrix 却只有 windows-latest
# 且硬编码 --win —— 选 mac 或 linux 拿到的还是 exe。选项是假的。
# 现在按 target 真的分到对应 runner 上跑。
#
# ⚠ 成本核算（免费额度下必须知道）：
#   Linux   runner 1x 分钟
#   Windows runner 2x 分钟
#   macOS   runner 10x 分钟   ← mac 构建很贵，别没事反复跑
# 所以默认只跑 win；要 mac/linux 得显式选。

on:
  workflow_dispatch:
    inputs:
      target:
        description: 打包目标
        type: choice
        options: [win, mac, linux, all]
        default: win

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            plat: win
            flag: --win --x64
            art: chat-desktop-win
            glob: |
              dist/*.exe
              dist/*.msi
          - os: macos-latest
            plat: mac
            flag: --mac --x64 --arm64
            art: chat-desktop-mac
            glob: |
              dist/*.dmg
              dist/*.zip
          - os: ubuntu-latest
            plat: linux
            flag: --linux --x64
            art: chat-desktop-linux
            glob: |
              dist/*.AppImage
              dist/*.deb
    # ⚠ 不能在这里写 if —— jobs.<id>.if 不支持 matrix 上下文（matrix 在 job 展开时才生成，
    # job 级 if 求值更早）。之前就是这么写的，结果 jobs 数为 0，整个 workflow 根本没运行，
    # 连续四次 push 全是 failure 却看不出原因。
    # 正确做法：矩阵全展开，在 step 级用 inputs 判断要不要真的跑。
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # 不要 npm init -y：它会覆盖仓库里已写好的 package.json，
      # 把 electron-builder 的 build 配置（各平台目标）冲掉。
      - name: 装 Electron 打包工具
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == matrix.plat }}
        run: |
          test -f package.json || npm init -y --silent
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            p.name=p.name||'chat-desktop'; p.version=p.version||'1.0.0';
            p.main='electron/main.js';
            fs.writeFileSync('package.json', JSON.stringify(p,null,2));
          "
          npm i --save-dev electron electron-builder --silent --no-fund --no-audit
          node -e "console.log('build 配置:', JSON.stringify(require('./package.json').build))"

      - name: 构建
        id: build
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == matrix.plat }}
        shell: bash
        run: |
          # 完整输出留档。沙箱拿不到 Actions 日志，只能自己写回来。
          npx electron-builder ${{ matrix.flag }} --publish never 2>&1 | tee desktop-log.txt
          echo "exit=${PIPESTATUS[0]}"
          ls dist 2>/dev/null | head -20 >> desktop-log.txt || echo "dist 为空" >> desktop-log.txt
          exit ${PIPESTATUS[0]}

      # 诊断步骤：永远不该影响 job 结论。
      # 之前就是它失败把整个 workflow 拖成红叉，而真正的产物其实已经成功了。
      - name: 日志写回
        if: ${{ always() && (github.event.inputs.target == 'all' || github.event.inputs.target == matrix.plat) }}
        continue-on-error: true
        shell: bash
        run: |
          git config user.name  "diag-bot"
          git config user.email "diag@local"
          git checkout --orphan diag-desktop-${{ matrix.plat }} 2>/dev/null || git checkout diag-desktop-${{ matrix.plat }}
          git rm -rf --cached . >/dev/null 2>&1 || true
          if [ ! -f desktop-log.txt ]; then echo "(无输出)" > desktop-log.txt; fi
          git add -f desktop-log.txt
          git commit -m "桌面构建日志 ${{ matrix.plat }} $(date -u +%Y%m%d-%H%M%S)" || echo "无变化"
          git push -f origin diag-desktop-${{ matrix.plat }} || echo "推送失败（不影响产物）"

      - name: 上传安装包
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.art }}
          path: ${{ matrix.glob }}
          if-no-files-found: warn
          retention-days: 30
