name: 构建桌面版

on:
  workflow_dispatch:
    inputs:
      target:
        description: 打包目标
        type: choice
        options: [all, win, mac, linux]
        default: win

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        include:
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # 不要 npm init -y：它会覆盖仓库里已写好的 package.json，
      # 把 electron-builder 的 build 配置（win 目标、NSIS/portable）冲掉，
      # 结果 electron-builder 不知道该怎么打包，自然出不了 exe。
      - name: 装 Electron 打包工具
        run: |
          test -f package.json || npm init -y --silent
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            p.name=p.name||'chat-desktop'; p.version=p.version||'1.0.0';
            p.main='electron/main.js';
            fs.writeFileSync('package.json', JSON.stringify(p,null,2));
          "
          npm i electron electron-builder --silent --no-fund --no-audit
          node -e "console.log('build 配置:', JSON.stringify(require('./package.json').build))"

      - name: 构建
        id: build
        shell: bash
        run: |
          # 完整输出留档。沙箱拿不到 Actions 日志，只能自己写回来。
          npx electron-builder --win --x64 --publish never 2>&1 | tee build-log.txt
          echo "exit=${PIPESTATUS[0]}"
          ls dist 2>/dev/null | head -20 >> build-log.txt || echo "dist 为空" >> build-log.txt
          exit ${PIPESTATUS[0]}

      # 必须 always：构建失败时这份日志才是唯一线索
      - name: 日志写回 diag 分支
        if: always()
        shell: bash
        run: |
          git config user.name  "diag-bot"
          git config user.email "diag@local"
          git checkout --orphan diag 2>/dev/null || git checkout diag
          git rm -rf --cached . >/dev/null 2>&1 || true
          [ -f build-log.txt ] && git add -f build-log.txt || echo "无日志" > build-log.txt
          git add -f build-log.txt
          git commit -m "桌面构建日志 $(date -u +%Y%m%d-%H%M%S)" || echo "无变化"
          git push -f origin diag

      - name: 上传安装包
        uses: actions/upload-artifact@v5
        with:
          name: chat-desktop-win
          path: |
            dist/*.exe
            dist/*.msi
          if-no-files-found: warn
          retention-days: 30
