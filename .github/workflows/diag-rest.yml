name: diag-rest
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 测 REST 是否可达
        run: |
          SB='https://pimryrsxkwyafmponegp.supabase.co'
          KEY='sb_publishable_jPrK6j5l9NGbnLKcytTegg_di1njO8t'
          echo "=== Actions 出口 IP ==="
          curl -s --max-time 15 https://api.ipify.org || echo "(取不到)"
          echo ""
          echo "=== 1. 根路径 ==="
          curl -s --max-time 20 "$SB/rest/v1/" -H "apikey: $KEY" -w "\nHTTP=%{http_code}\n" | head -c 300
          echo ""
          echo "=== 2. site_ready ==="
          curl -s --max-time 20 -X POST "$SB/rest/v1/rpc/site_ready" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' -w "\nHTTP=%{http_code}\n" | head -c 300
          echo ""
          echo "=== 3. state_get ==="
          curl -s --max-time 20 -X POST "$SB/rest/v1/rpc/state_get" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' -w "\nHTTP=%{http_code}\n" | head -c 400
