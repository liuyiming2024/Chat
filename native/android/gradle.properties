# ⚠ android.useAndroidX=true 必须有（BUILD-USEANDROIDX）。
#   缺它时 checkDebugAarMetadata 直接失败：
#     "contains AndroidX dependencies, but the android.useAndroidX property is not enabled"
#   这条报错很长（列出几十个依赖链），但根因就一行配置。
android.useAndroidX=true
android.enableJetifier=false

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
# Room 的 schema 导出关掉：不需要持久化 schema 历史，
# 开着会多出 schemas/ 目录，容易让人以为那是数据库文件。
android.room.incremental=true
