<!-- 返回站点首页（聊天室为全屏应用，仅在角落放一个小入口，不干扰布局） -->
<a class="back-home" href="../index.html" title="返回首页" aria-label="返回首页">← 首页</a>

<!-- ============ 门禁 / 登录 ============ -->
<div id="gate" class="mask hidden" style="display:flex"></div>

<!-- ============ 主界面 ============ -->
<div id="app" class="app hidden" style="display:none">

  <!-- 左侧：会话列表 -->
  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <div class="search-box">
        <span class="search-ico"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg></span>
        <input id="searchInput" placeholder="搜索会话">
      </div>
      <button class="icon-btn green" id="btnNewRoom" title="创建群聊" aria-label="创建群聊"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></button>
    </div>
    <div class="me-card" id="meCard"></div>
    <div id="modeTagHost" class="mode-tag" style="display:none"></div>
    <style>
      .mode-tag{font-size:12px;padding:3px 8px;border-radius:6px;white-space:nowrap}
      .mode-tag.warn{background:#fff4e5;color:#8a5300;border:1px solid #ffcf8b}
      .mode-tag.ok{background:#eaf7ec;color:#1d6b2b;border:1px solid #a8ddb0}
    </style>
    <div class="room-list" id="roomList"></div>
    <div class="side-foot">
      <button class="mini-btn" id="btnAdmin">管理面板</button>
      <button class="mini-btn" id="btnLogout">退出</button>
    </div>
  </aside>

  <!-- 中间：聊天区 -->
  <main class="main">
    <header class="chat-head">
      <button class="icon-btn only-narrow" id="btnMenu" title="会话列表" aria-label="会话列表"><svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg></button>
      <div class="ch-info">
        <div class="ch-title" id="roomTitle">公屏大厅</div>
        <div class="ch-sub" id="roomSub">公屏大厅</div>
      </div>
      <div class="ch-actions">
        <button class="icon-btn mode-btn" id="btnMode" title="切换极简 / 专业模式" aria-label="切换极简 / 专业模式">专业</button>
        <button class="icon-btn" id="btnRoomSet" title="会话设置" aria-label="会话设置"><svg class="ic" aria-hidden="true"><use href="#i-settings"/></svg></button>
        <button class="icon-btn" id="btnMembers" title="成员面板" aria-label="成员面板"><svg class="ic" aria-hidden="true"><use href="#i-members"/></svg></button>
      </div>
    </header>

    <div id="pinnedBar" class="pinned-bar hidden"></div>

    <div id="noticeBar" class="notice-bar hidden"></div>

    <div id="mutedTip" class="muted-tip hidden"></div>
    <!-- 免打扰状态条：免打扰生效时必须看得见，否则用户会以为通知坏了 -->
    <div id="dndTip" class="dnd-tip hidden"></div>

    <div class="msg-scroll" id="msgScroll"></div>

    <div class="composer">
      <div id="replyBar" class="reply-bar hidden"></div>
      <div class="composer-tools">
        <button class="tool-btn" id="btnImg" title="发送图片" aria-label="发送图片"><svg class="ic" aria-hidden="true"><use href="#i-image"/></svg></button>
        <button class="tool-btn" id="btnVideo" title="发送视频" aria-label="发送视频"><svg class="ic" aria-hidden="true"><use href="#i-video"/></svg></button>
        <button class="tool-btn" id="btnFile" title="发送文件（zip/pdf 等）" aria-label="发送文件（zip/pdf 等）"><svg class="ic" aria-hidden="true"><use href="#i-file"/></svg></button>
        <button class="tool-btn" id="btnVoice" title="按住说话 / 点一下开始录音" aria-label="按住说话 / 点一下开始录音"><svg class="ic" aria-hidden="true"><use href="#i-voice"/></svg></button>
        <button class="tool-btn" id="btnEmoji" title="表情" aria-label="表情"><svg class="ic" aria-hidden="true"><use href="#i-emoji"/></svg></button>
        <button class="tool-btn" id="btnAt" title="提及某人" aria-label="提及某人">@</button>
        <button class="tool-btn pro-only" id="btnHelp" title="Markdown / LaTeX / 命令帮助" aria-label="Markdown / LaTeX / 命令帮助">?</button>
        <span class="rec-tip hidden" id="recTip">● 录音中 <span id="recSec">0</span>s · 松开发送
          <button class="rec-x" id="recCancel" type="button" title="取消录音，不发送" aria-label="取消录音，不发送">✕ 取消</button></span>
        <span class="composer-hint">Enter 发送 · Shift+Enter 换行 · 支持 **Markdown**、`$x^2$` 公式、拖入图片视频</span>
      </div>
      <div class="md-bar pro-only" id="mdBar">
        <button class="md-btn" data-ins="**" data-ins2="**" title="粗体" aria-label="粗体"><b>B</b></button>
        <button class="md-btn" data-ins="*" data-ins2="*" title="斜体" aria-label="斜体"><i>I</i></button>
        <button class="md-btn" data-ins="~~" data-ins2="~~" title="删除线" aria-label="删除线"><s>S</s></button>
        <button class="md-btn" data-ins="`" data-ins2="`" title="行内代码" aria-label="行内代码">&lt;/&gt;</button>
        <button class="md-btn" data-ins="```cpp\n" data-ins2="\n```" title="代码块" aria-label="代码块">```</button>
        <button class="md-btn" data-ins="$" data-ins2="$" title="行内公式" aria-label="行内公式">$x$</button>
        <button class="md-btn" data-ins="$$\n" data-ins2="\n$$" title="块级公式" aria-label="块级公式">$$</button>
        <button class="md-btn" data-ins="> " data-ins2="" title="引用">❝</button>
        <button class="md-btn" data-ins="- " data-ins2="" title="列表" aria-label="列表">•</button>
        <button class="md-btn" id="btnSym" title="公式符号面板" aria-label="公式符号面板">√</button>
      </div>
      <textarea id="input" rows="1" placeholder="说点什么…（/help 查看命令）"></textarea>
      <div class="composer-foot">
        <button class="btn primary" id="btnSend">发送(S)</button>
      </div>
    </div>
  </main>

  <!-- 右侧：成员与公告 -->
  <aside class="side-panel" id="sidePanel">
    <div class="sp-head">成员 <span id="memberCount" class="tag gray">0</span></div>
    <div class="sp-body" id="memberList"></div>
    <div class="sp-sec">
      <div class="sec-title"><span>群公告</span><button class="mini-btn" id="btnEditNotice">编辑</button></div>
      <div class="notice-text" id="noticeText">暂无公告</div>
    </div>
  </aside>
</div>

<input type="file" id="fileVideo" accept="video/*" class="hidden">

<!-- ================= PWA 安装与更新 =================
     注册 service worker，并在拿到新版本时提示刷新。
     不提示的话，用户会一直用着缓存里的旧版，而我们还以为已经上线了。 -->
<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  /* file:// 下注册会直接抛错，本地双击打开时跳过 */
  if (location.protocol === 'file:') return;

  function showUpdate(worker) {
    var bar = document.createElement('div');
    bar.className = 'sw-update';
    bar.innerHTML = '<span>有新版本</span>' +
      '<button type="button" class="sw-upd-ok">刷新</button>' +
      '<button type="button" class="sw-upd-no" aria-label="稍后">×</button>';
    bar.querySelector('.sw-upd-ok').onclick = function () {
      if (worker) worker.postMessage('SKIP_WAITING');
      location.reload();
    };
    bar.querySelector('.sw-upd-no').onclick = function () { bar.remove(); };
    document.body.appendChild(bar);
  }

  navigator.serviceWorker.register('sw.js').then(function (reg) {
    if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
    reg.addEventListener('updatefound', function () {
      var nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', function () {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) {
          showUpdate(nw);
        }
      });
    });
  }).catch(function () { /* 注册失败不影响正常使用 */ });

  /* 安装按钮：浏览器支持时显示，让用户知道能装成应用 */
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    var evt = e;
    var btn = document.createElement('button');
    btn.className = 'sw-install';
    btn.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg> 安装到桌面';
    btn.onclick = function () { btn.remove(); evt.prompt(); };
    document.body.appendChild(btn);
  });
})();
</script>
