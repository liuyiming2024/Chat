<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b7ff2'/%3E%3Cpath d='M8 11h16M8 16h11' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<title>贴吧 · 聊天室</title>
<link rel="stylesheet" href="../assets/site.css">

  <style>
    .mode-banner{padding:8px 12px;border-radius:8px;margin:10px 0;font-size:13px;
      display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .mode-banner.warn{background:#fff4e5;border:1px solid #ffcf8b;color:#8a5300}
    .mode-banner.ok{background:#eaf7ec;border:1px solid #a8ddb0;color:#1d6b2b}
  </style>
</head>
<body>
<!--
  共享图标库（内联 SVG sprite）。

  为什么内联而不是外部 .svg 文件：
    站点要支持 file:// 双击直接打开，外部 SVG sprite 在 file:// 下
    会被 CORS 挡掉，Safari 也不支持跨文档 <use>。内联才能全场景可用。

  用法：
    <svg class="ic" aria-hidden="true"><use href="#i-moon"/></svg>

  风格统一：24×24 视口、stroke=currentColor、fill=none、圆角端点。
  这样图标颜色自动跟随文字，深色模式不用额外处理。
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-moon" viewBox="0 0 24 24">
    <path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8a8.6 8.6 0 1 0 10.8 10.8z"/>
  </symbol>
  <symbol id="i-sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4.2"/>
    <path d="M12 2.4v2.2M12 19.4v2.2M4.2 12H2M22 12h-2.2M6.4 6.4 4.8 4.8M19.2 19.2l-1.6-1.6M17.6 6.4l1.6-1.6M4.8 19.2l1.6-1.6"/>
  </symbol>
  <symbol id="i-rocket" viewBox="0 0 24 24">
    <path d="M13.6 3.4c3.4-1 6.2.6 7 2.6.8 2-.6 4.6-2.6 6.4l-1.6 1.4-5-5 1.4-1.6c1.6-1.8 3-3 3.4-3.8z" />
    <path d="M11 9.4 7.6 12.8M5.4 15l-1.8 4.6L8.2 17.8"/>
    <circle cx="15.4" cy="8.6" r="1.4"/>
  </symbol>
  <symbol id="i-pen" viewBox="0 0 24 24">
    <path d="M16.4 3.6a2.3 2.3 0 0 1 3.3 3.3L8.4 18.2l-4.4 1.4 1.4-4.4z"/>
    <path d="M14.4 5.6l3.3 3.3"/>
  </symbol>
  <symbol id="i-key" viewBox="0 0 24 24">
    <circle cx="8" cy="16" r="3.6"/>
    <path d="M10.6 13.4 19 5M16.6 5h3.4v3.4M18 8.4l-2.4 2.4"/>
  </symbol>
  <symbol id="i-settings" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3.2"/>
    <path d="M19.4 12a7.4 7.4 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7.4 7.4 0 0 0-2-1.2L14.6 3H9.4l-.4 2.6a7.4 7.4 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5a7.4 7.4 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-1a7.4 7.4 0 0 0 2 1.2l.4 2.6h5.2l.4-2.6a7.4 7.4 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/>
  </symbol>
  <symbol id="i-box" viewBox="0 0 24 24">
    <path d="M20.6 7.6 12 3 3.4 7.6v8.8L12 21l8.6-4.6z"/>
    <path d="M3.6 7.6 12 12l8.4-4.4M12 12v9"/>
  </symbol>
  <symbol id="i-forum" viewBox="0 0 24 24">
    <rect x="3" y="4" width="18" height="16" rx="2.6"/>
    <path d="M7 8.8h10M7 12h10M7 15.2h6"/>
  </symbol>
  <symbol id="i-chat" viewBox="0 0 24 24">
    <path d="M4.6 4H19.4A2.6 2.6 0 0 1 22 6.6v6.8a2.6 2.6 0 0 1-2.6 2.6H11.4L7.4 20v-4H4.6A2.6 2.6 0 0 1 2 13.4V6.6A2.6 2.6 0 0 1 4.6 4z"/>
  </symbol>
  <symbol id="i-docs" viewBox="0 0 24 24">
    <path d="M3 5.6A2.6 2.6 0 0 1 5.6 3H11v16H5.6A2.6 2.6 0 0 1 3 16.4z"/>
    <path d="M21 5.6A2.6 2.6 0 0 0 18.4 3H13v16h5.4A2.6 2.6 0 0 0 21 16.4z"/>
  </symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24">
    <rect x="2.5" y="3.5" width="19" height="13" rx="1.6"/>
    <path d="M9 20.5h6M12 16.5v4"/>
  </symbol>
  <symbol id="i-phone" viewBox="0 0 24 24">
    <rect x="6.5" y="2.5" width="11" height="19" rx="2.2"/>
    <path d="M10.8 5.4h2.4M11 18.6h2"/>
  </symbol>
</svg>


<nav class="nav">
  <div class="nav-inner">
    <a class="logo" href="../index.html"><span class="logo-mark">聊</span>聊天室</a>
    <div class="nav-links">
      <a href="../index.html" data-nav="home">首页</a>
      <a href="../chat/index.html" data-nav="chat">聊天室</a>
      <a href="../tieba/index.html" data-nav="tieba">贴吧</a>
      <a href="../docs/index.html" data-nav="docs">使用手册</a>
    </div>
    <div class="nav-tools">
      <button class="icon-btn" id="btnTheme" title="切换深色 / 浅色"><svg class="ic" aria-hidden="true"><use href="#i-moon"/></svg></button>
    </div>
  </div>
</nav>

<div class="wrap">

  <div id="cfgTip" class="tip warn" style="display:none"></div>

  <!-- 列表视图 -->
  <div id="viewList">
    <div class="forum-bar">
      <input class="field" id="searchKey" placeholder="搜索帖子标题或内容">
      <input class="field" id="nickInput" placeholder="你的昵称" style="max-width:150px">
      <button class="btn-sm primary" id="btnNew">＋ 发新帖</button>
      <!-- 后端设置是配置入口，不该与内容操作并排（普通用户会误点）。
           移到页脚设置区。 -->
      <button class="btn-sm" id="btnCfgTop" style="display:none">后端设置</button>
    </div>
    <div id="postList"></div>
  </div>

  <!-- 详情视图 -->
  <div id="viewPost" style="display:none">
    <div class="forum-bar">
      <button class="btn-sm" id="btnBack">← 返回列表</button>
    </div>
    <div id="postDetail"></div>
  </div>

</div>

<div class="foot">
  <div>贴吧 · 当前模式：<span id="modeTag">本地</span></div>
  <div style="margin-top:8px">
    <a href="../docs/privacy.html">隐私声明</a> ·
    <a href="../docs/terms.html">使用须知</a>
  </div>
  <!-- 模式横幅：换设备丢失数据这件事必须在使用前说清楚，
       不能只在页脚放一行小字。 -->
  <div id="modeBanner" class="mode-banner" style="display:none">
    <span id="modeBannerText"></span>
    <button class="btn-sm" id="bannerCfg">去配置</button>
  </div>
</div>

<script src="../assets/site.js"></script>
<script src="js/forum.js"></script>
</body>
</html>
